baseURL = "https://example.com/"
languageCode = "en-us"
title = "Velociraptor presentations"
disableKinds = ["sitemap", "RSS"]
# theme = "github.com/joshed-io/reveal-hugo"
# theme = "."
# themesDir = "../"

# uncomment for browsing at file:///
# relativeURLs = true
# uglyURLs = true

# choose between Hugo compile-time or Highlight.js
# syntax highlighting for code inside of code fences
[markup.highlight]
#codeFences = false  # use highlight.js
codeFences = true  # use hugo highlighting at compile time
style = "tango"  # set a style for hugo highlighting

[outputFormats.Reveal]
baseName = "pres"
mediaType = "text/html"
isHTML = true

[outputFormats.HTML]
baseName = "index"
mediaType = "text/html"
isHTML = true

[params]
  [params.theme]
    default = "system"    # valid: light, dark, system (system = follow OS preference for new visitors)
    # displayToggle is intentionally unset: the theme's footer/sidebar
    # theme-toggle rows are removed (the switcher lives in the top navbar).

  # Click-to-zoom on figure images (medium-zoom), as on the reference site.
  # Rendered via hextra's scripts/medium-zoom partial when a page sets the
  # "hasImageZoom" store flag (file: layouts/_markup/render-image.html).
  # The js asset is vendored locally (assets/js/medium-zoom.min.js) so
  # builds do not depend on fetching the library from the CDN.
  [params.imageZoom]
    enable = true
    js = "js/medium-zoom.min.js"

  [params.navbar]
    width = "normal"      # 80rem; matches the reference docs sites

    displayTitle = false
    [params.navbar.logo]
      path = "images/logo_bare_small.svg"
      width = "22"
      height = "34"

  [params.footer]
    enable = false
    width = "normal"
    displayPoweredBy = false
    displayCopyright = true

  [params.page]
    width = "normal"
    displayPagination = true

  # "Edit this page" link in the right-hand TOC column.
  [params.editURL]
    enable = true
    base = "https://github.com/Velocidex/presentations/edit/master/content/"

  # Search entry point. Hextra ships FlexSearch; this site keeps Pagefind
  # (see the layouts/_partials/scripts/search.html override).
  [params.search]
    enable = true

  [params.toc]
    displayTags = false

  [params.math]
    engine = "katex"

  [params.reveal_hugo]
    history = true

   # used in content/template-example
  [params.reveal_hugo.templates.grey]
     background = "#424242"
     transition = "convex"

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"
    version = "v0.12.3"

  [[module.imports]]
    path = "github.com/joshed-io/reveal-hugo"

[markup.goldmark]
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

  [markup.goldmark.parser.attribute]
    block = true

  [markup.goldmark.renderer]
    unsafe = true

  [markup.goldmark.extensions]
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4