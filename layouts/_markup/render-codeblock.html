{{- $title := .Type -}}
{{- if eq $title "sql" -}}{{- $title = "VQL" -}}{{- end -}}
<div class="screenshot-wrapper">
  <div class="window-header">
    <div class="window-dots">
      <span class="dot-btn dot-close"></span>
      <span class="dot-btn dot-min"></span>
      <span class="dot-btn dot-max"></span>
    </div>
    <span class="window-title">{{- $title -}}</span>
  </div>
  <div class="window-body code-block">
    {{- $result := transform.HighlightCodeBlock . -}}
    {{- $result.Wrapped -}}
  </div>
</div>
